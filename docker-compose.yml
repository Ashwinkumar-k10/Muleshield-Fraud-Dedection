version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: muleshield_postgres
    restart: always
    environment:
      POSTGRES_USER: muleshield
      POSTGRES_PASSWORD: muleshield_secure
      POSTGRES_DB: muleshield_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
